kind = "mobile"
previewPath = "/"
title = "Biz360"
version = "1.0.0"
id = "artifacts/biz360"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 22341

[services.development]
run = "pnpm --filter @workspace/biz360 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/biz360", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/biz360", "run", "serve" ]

[services.env]
PORT = "22341"
BASE_PATH = "/"

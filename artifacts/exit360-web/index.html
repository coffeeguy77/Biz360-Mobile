    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "EXIT360",
      "description": "Discover verified businesses for sale with immersive 360° virtual tours.",
      "url": "https://exit360.com"

  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the saved colour theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("exit360_theme");
          if (t && t !== "default") document.documentElement.classList.add("theme-" + t);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
